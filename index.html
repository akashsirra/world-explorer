<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#061018">
<meta name="description" content="World Explorer — a real-world exploration game driven by your location, weather and time.">
<link rel="manifest" href="/manifest.webmanifest">
<title>World Explorer</title>
<link rel="stylesheet" href="/vendor/leaflet.css">
<link rel="stylesheet" href="/style.css?v=24">
<link rel="stylesheet" href="/ui-overrides.css?v=24">
<link rel="stylesheet" href="/weather.css?v=24">
</head>
<body>
<div id="map"></div>
<div class="map-loading" id="mapLoading"><span></span><b>Loading your world…</b></div>
<div class="shade day" id="shade"></div>
<header class="top">
<label class="search"><span aria-hidden="true">⌕</span><input id="search" placeholder="Explore your world" autocomplete="off" inputmode="search" aria-label="Search for a place"></label>
<button class="glass" id="loc" aria-label="Locate me">◉</button>
</header>
<aside class="side">
<button class="tool" id="center" aria-label="Center on Explorer Core">⌖</button>
<button class="tool" id="refresh" aria-label="Scan for discoveries">◌</button>
<button class="tool" id="weather" aria-label="Refresh weather">☁</button>
<button class="tool" id="toggle" aria-label="Toggle day and night">☾</button>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<section class="hud" id="explorerHud" aria-label="Explorer status">
<div class="handle-row"><div class="handle"></div><button class="hud-toggle" id="hudToggle" type="button" aria-label="Minimize explorer panel" aria-expanded="true" title="Minimize explorer panel">⌄</button></div>
<div class="stats"><div><div class="eyebrow">YOUR WORLD</div><div class="percent"><span id="pct">0</span>% explored</div></div><div class="near"><div class="eyebrow">NEARBY</div><b id="near">0 <small>✦</small></b></div></div>
<div class="progress" aria-label="Exploration progress"><i id="bar"></i></div>
<div class="chips">
<button class="chip scan" id="scan">✦ Scan</button>
<div class="chip" id="disc">✦ 0 discoveries</div>
<div class="chip">🧭 Explorer</div>
<div class="chip" id="quest">🎯 Find 3 discoveries</div>
<div class="chip" id="wx">☁ Loading</div>
</div>
<nav class="nav" aria-label="Explorer sections">
<button class="nav-btn active" data-tab="map"><span>🗺️</span>Map</button>
<button class="nav-btn" data-tab="discover"><span>✨</span>Discover</button>
<button class="nav-btn" data-tab="memories"><span>📸</span>Memories</button>
<button class="nav-btn" data-tab="profile"><span>🏆</span>Profile</button>
</nav>
</section>
<div class="sheet" id="sheet"><section class="panel"><div class="head"><h2 id="title">Discover</h2><button class="close" id="close" aria-label="Close">×</button></div><div id="body"></div></section></div>
<script src="/vendor/leaflet.js"></script>
<script src="/mobile-engine.js?v=24"></script>
<script src="/weather-engine.js?v=24"></script>
<script>
(() => {
  const version = '24';
  const start = () => {
    if (!window.L || window.__WORLD_EXPLORER_STARTED__) return;
    window.__WORLD_EXPLORER_STARTED__ = true;
    const app = document.createElement('script');
    app.src = '/app.js?v=' + version;
    app.onload = () => {
      ['radar-visibility.js','hud-toggle.js','signal-polish.js'].forEach(file => {
        const script = document.createElement('script');
        script.src = '/' + file + '?v=' + version;
        document.body.appendChild(script);
      });
      requestAnimationFrame(() => setTimeout(() => document.getElementById('mapLoading')?.classList.add('hidden'), 250));
    };
    app.onerror = () => { const el=document.getElementById('mapLoading'); if(el)el.innerHTML='<b>The Explorer Core failed to start. Please reload.</b>'; };
    document.body.appendChild(app);
  };
  if (window.L) start(); else { const el=document.getElementById('mapLoading'); if(el)el.innerHTML='<b>Map engine unavailable. Please reload.</b>'; }
  if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js?v='+version).catch(()=>{}));
})();
</script>
</body>
</html>
