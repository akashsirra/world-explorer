<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#06101a">
<meta name="description" content="World Explorer — a game-like living map that changes with weather and day/night.">
<title>World Explorer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;overflow:hidden}body{background:#050b12;color:#eff8ff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#map{position:fixed;inset:0}.leaflet-control-zoom{display:none}.leaflet-control-attribution{font-size:9px!important;background:rgba(4,10,16,.55)!important;color:#b9c9d5!important}.leaflet-control-attribution a{color:#d6edf9!important}
:root{--glass:rgba(5,15,25,.84);--line:rgba(180,220,255,.14);--cyan:#63e5ff;--violet:#9b84ff;--gold:#ffd85c}
.ui{position:fixed;inset:0;z-index:1000;pointer-events:none}.top{position:absolute;top:18px;left:22px;right:22px;display:flex;gap:12px;pointer-events:auto}.search,.iconbtn,.round,.hud,.status,.sheet{border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 14px 45px #0007}.search{height:58px;flex:1;border-radius:24px;display:flex;align-items:center;padding:0 18px}.search span{font-size:25px;opacity:.72}.search input{min-width:0;width:100%;border:0;outline:0;background:transparent;color:#eff8ff;font-size:18px;padding-left:12px}.search input::placeholder{color:#b8c6d0}.iconbtn{width:58px;height:58px;border-radius:22px;color:#fff;font-size:23px}
.status{position:absolute;top:88px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:999px;font-size:13px;white-space:nowrap;opacity:0;transition:.3s}.status.show{opacity:1}.controls{position:absolute;right:22px;bottom:315px;display:flex;flex-direction:column;gap:10px;pointer-events:auto}.round{width:58px;height:58px;border-radius:20px;color:#fff;font-size:24px}.round:active,.iconbtn:active{transform:scale(.94)}
.hud{position:absolute;left:22px;right:22px;bottom:18px;border-radius:28px;padding:18px 22px 14px;pointer-events:auto}.handle{width:42px;height:5px;border-radius:9px;background:#a8b7c455;margin:0 auto 16px}.row{display:flex;justify-content:space-between;align-items:end}.eyebrow{font-size:12px;letter-spacing:2px;color:#9fb1bf}.score{font-size:40px;font-weight:850;line-height:1.05}.near{text-align:right}.near b{font-size:34px}.progress{height:9px;background:#fff1;border-radius:99px;overflow:hidden;margin:13px 0}.progress i{display:block;width:5%;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--violet));box-shadow:0 0 18px #63e5ff77;transition:1s}.chips{display:flex;gap:8px;overflow:auto;scrollbar-width:none;margin-bottom:13px}.chip{white-space:nowrap;padding:8px 11px;border:1px solid #fff1;background:#fff1;border-radius:999px;color:#c8d5de;font-size:12px}.nav{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}.nav button{border:0;background:transparent;color:#8394a2;font-size:11px}.nav .ico{display:block;font-size:24px;margin-bottom:2px}.nav .sel{color:#fff}
.player{position:relative;width:76px;height:86px;filter:drop-shadow(0 0 18px #63e5ff99)}.aura{position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,#63e5ff42 0 25%,transparent 62%);animation:pulse 2s infinite}.diamond{position:absolute;left:14px;top:7px;width:48px;height:48px;transform:rotate(45deg);border-radius:14px;background:linear-gradient(145deg,#e8ffff,#62dcff 42%,#766cff);border:2px solid #eaffff;box-shadow:inset 0 0 14px #fff9,0 0 28px #63e5ffb5}.diamond:after{content:"";position:absolute;inset:9px;border:1px solid #fff8;border-radius:7px}.trail{position:absolute;left:35px;top:55px;width:7px;height:24px;border-radius:99px;background:linear-gradient(#63e5ff,transparent)}
.poi{width:68px;height:68px;border-radius:22px;background:#06131f;border:1px solid #ffd85c88;display:grid;place-items:center;font-size:31px;box-shadow:0 0 28px #ffd85c30,inset 0 0 20px #fff08;animation:float 3s ease-in-out infinite}.poi.weather{border-color:#63e5ff99;box-shadow:0 0 30px #63e5ff3d,inset 0 0 20px #fff08}.poi.rare{border-color:#c39cff;box-shadow:0 0 30px #a17dff66,inset 0 0 20px #fff08}
.panel{position:absolute;inset:0;background:#030a10aa;backdrop-filter:blur(14px);display:none;align-items:flex-end;padding:18px;pointer-events:auto}.panel.open{display:flex}.sheet{width:100%;border-radius:28px;padding:22px;max-height:70vh;overflow:auto}.sheet h2{margin:0 0 6px}.sheet p{color:#adbdc9;line-height:1.5}.big{font-size:56px;margin:10px 0}.close{float:right;border:0;background:#fff1;color:#fff;border-radius:12px;padding:8px 11px}.action{width:100%;padding:15px;border:0;border-radius:16px;background:linear-gradient(100deg,#63e5ff,#9b84ff);color:#06101a;font-weight:850;font-size:15px}
@keyframes pulse{50%{transform:scale(1.22);opacity:.45}}@keyframes float{50%{transform:translateY(-7px)}}
@media(min-width:700px){.hud{left:auto;right:28px;bottom:28px;width:430px}.controls{bottom:270px}.top{right:auto;width:680px}}
</style>
</head>
<body>
<div id="map"></div>
<div class="ui">
<div class="top"><div class="search"><span>⌕</span><input id="search" placeholder="Explore your world" autocomplete="off"></div><button class="iconbtn" id="locate">◉</button></div>
<div class="status" id="status"></div>
<div class="controls"><button class="round" id="center">⌖</button><button class="round" id="discover">◌</button><button class="round" id="weather">☁</button><button class="round" id="theme">☾</button></div>
<div class="hud"><div class="handle"></div><div class="row"><div><div class="eyebrow">YOUR WORLD</div><div class="score"><span id="explored">5</span>% explored</div></div><div class="near"><div class="eyebrow">NEARBY</div><b id="nearby">0</b> ✨</div></div><div class="progress"><i id="bar"></i></div><div class="chips"><div class="chip" id="disc">✨ 0 discoveries</div><div class="chip">🧭 <span id="mode">Day</span> mode</div><div class="chip">🎯 1 quest</div><div class="chip" id="wx">🌍 Reading sky</div></div><div class="nav"><button class="sel" id="mapTab"><span class="ico">🗺️</span>Map</button><button id="discoverTab"><span class="ico">✨</span>Discover</button><button id="memoryTab"><span class="ico">📸</span>Memories</button><button id="profileTab"><span class="ico">🏆</span>Profile</button></div></div>
<div class="panel" id="panel"><div class="sheet"><button class="close" id="close">✕</button><h2 id="ptitle">Discovery</h2><p id="ptext">A hidden fragment is waiting.</p><div class="big" id="picon">✨</div><button class="action" id="collect">Collect discovery</button></div></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const $=id=>document.getElementById(id);let map,userMarker,userPos=null,weather=null,markers=[],found=0,explored=5,nightManual=false;
const weatherNames={0:'☀️ Clear',1:'🌤️ Mostly clear',2:'⛅ Partly cloudy',3:'☁️ Cloudy',45:'🌫️ Fog',48:'🌫️ Fog',51:'🌦️ Drizzle',53:'🌦️ Drizzle',55:'🌦️ Drizzle',61:'🌧️ Rain',63:'🌧️ Rain',65:'🌧️ Heavy rain',71:'🌨️ Snow',73:'🌨️ Snow',75:'❄️ Snow',80:'🌦️ Showers',81:'🌦️ Showers',82:'🌧️ Heavy showers',95:'⛈️ Storm',96:'⛈️ Storm',99:'⛈️ Storm'};
function toast(t){$('status').textContent=t;$('status').classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('status').classList.remove('show'),2300)}
function playerIcon(){return L.divIcon({className:'',html:'<div class="player"><div class="aura"></div><div class="diamond"></div><div class="trail"></div></div>',iconSize:[76,86],iconAnchor:[38,43]})}
function poiIcon(e,kind){return L.divIcon({className:'',html:`<div class="poi ${kind||''}">${e}</div>`,iconSize:[68,68],iconAnchor:[34,34]})}
function addPoi(lat,lng,emoji,kind=''){const m=L.marker([lat,lng],{icon:poiIcon(emoji,kind)}).addTo(map);m.on('click',()=>openDiscovery(emoji,kind));markers.push(m)}
function openDiscovery(icon,kind){$('ptitle').textContent=kind==='weather'?'Living Weather Discovery':'Hidden Discovery';$('picon').textContent=icon;$('ptext').textContent=kind==='weather'?'This discovery was generated from the current sky and time. Come back later and the world can change.':'You found a collectible fragment. The world is a game board — explore farther to reveal more.';$('panel').classList.add('open');$('collect').onclick=()=>{found++;explored=Math.min(100,explored+1);$('explored').textContent=explored;$('bar').style.width=explored+'%';$('disc').textContent='✨ '+found+' discoveries';$('panel').classList.remove('open');toast('Discovery added to your journal ✨')}}
function init(){map=L.map('map',{zoomControl:false,minZoom:3,maxZoom:19,zoomSnap:.5}).setView([20.5,78.9],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);$('bar').style.width=explored+'%';locate()}
function locate(){if(!navigator.geolocation){fallback();return}navigator.geolocation.getCurrentPosition(p=>{userPos=[p.coords.latitude,p.coords.longitude];map.flyTo(userPos,15,{duration:.9});if(userMarker)userMarker.setLatLng(userPos);else userMarker=L.marker(userPos,{icon:playerIcon(),zIndexOffset:2000}).addTo(map);toast('🧭 You are here — hunt the glowing fragments');loadWeather();spawn();},()=>fallback(),{enableHighAccuracy:true,timeout:10000,maximumAge:60000})}
function fallback(){userPos=[16.2,80.65];map.setView(userPos,12);userMarker=L.marker(userPos,{icon:playerIcon(),zIndexOffset:2000}).addTo(map);toast('📍 Explore mode enabled');loadWeather();spawn()}
async function loadWeather(){try{let [lat,lon]=userPos;let r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,is_day,wind_speed_10m&timezone=auto`);weather=await r.json()}catch(e){weather=null}applyWorld();spawn()}
function applyWorld(){let c=weather?.current||{};let isDay=c.is_day==null?(new Date().getHours()>6&&new Date().getHours()<18):!!c.is_day;let code=c.weather_code??0;let temp=c.temperature_2m;let label=weatherNames[code]||'🌍 Changing';$('mode').textContent=isDay?'Day':'Night';$('wx').textContent=label+(temp!=null?' '+Math.round(temp)+'°':'');$('theme').textContent=isDay?'☾':'☀️';$('map').style.filter=(isDay&&!nightManual)?'none':'brightness(.62) saturate(.82)';}
function spawn(){if(!userPos)return;markers.forEach(m=>map.removeLayer(m));markers=[];let [lat,lng]=userPos,c=weather?.current?.weather_code??0,isDay=weather?.current?.is_day??1;let set=c>=60&&c<=99?['🌧️','🌿','💧','🗿','✨']:c>=1&&c<=3?['☁️','☕','💎','🎨','✨']:isDay?['🌅','🎨','💎','🌿','✨']:['🌙','🗿','💎','✨','🧭'];let n=set.length;for(let i=0;i<n;i++){let a=i*1.256+.35,d=.0028+(i%3)*.0018;addPoi(lat+Math.cos(a)*d,lng+Math.sin(a)*d,set[i],i===0?'weather':(i===2?'rare':''))}$('nearby').textContent=n}
$('center').onclick=()=>{if(userPos){map.flyTo(userPos,16,{duration:.8});toast('🧭 Centered on your explorer')}};$('locate').onclick=locate;$('discover').onclick=()=>{if(markers[0]){map.flyTo(markers[0].getLatLng(),17,{duration:.8});openDiscovery('✨','')}};$('weather').onclick=()=>{loadWeather();toast('🌦️ Reading the sky…')};$('theme').onclick=()=>{nightManual=!nightManual;applyWorld();toast(nightManual?'🌙 Night filter on':'☀️ Natural time restored')};$('close').onclick=()=>$('panel').classList.remove('open');$('discoverTab').onclick=()=>toast('✨ Follow the glowing fragments');$('memoryTab').onclick=()=>openDiscovery('📸','');$('profileTab').onclick=()=>toast('🏆 Explorer level '+Math.max(1,Math.ceil(explored/10)));$('search').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()){let q=e.target.value.trim();toast('🔎 Searching '+q);window.open('https://www.openstreetmap.org/search?query='+encodeURIComponent(q),'_blank')}});init();
</script>
</body>
</html>
